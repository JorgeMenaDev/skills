<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Wainwrights Baggers: launch film</title>
<style>
/* Serve this folder over HTTP (render.mjs does): file:// blocks @font-face loads. */
@font-face { font-family: Brand; src: url(assets/font.woff2) format('woff2'); font-weight: 100 900; }
@font-face { font-family: Serif; src: url(assets/serif.woff2) format('woff2'); font-weight: 100 900; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overflow: hidden; background: #f3f1e4; }
body { font-family: Brand, -apple-system, 'Helvetica Neue', sans-serif; color: #112318; -webkit-font-smoothing: antialiased; }
.abs { position: absolute; }
.serif { font-family: Serif, Georgia, serif; }
#stage { position: absolute; inset: 0; overflow: hidden; background: #f3f1e4; }
#cam { position: absolute; left: 0; top: 0; transform-origin: 0 0; z-index: 1; }
#fx { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
.mask { position: absolute; overflow: hidden; }
.mask > * { position: absolute; left: 0; top: 0; white-space: nowrap; }
#phone { position: absolute; background: #0e0f0e; border-radius: 68px; box-shadow: 0 0 0 2px #3a3c3a, 0 40px 80px rgba(17,35,24,.28); z-index: 1; }
#scr { position: absolute; overflow: hidden; border-radius: 55px; background: #dfe9d3; z-index: 2; }
#map { position: absolute; inset: 0; overflow: hidden; }
#map img { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.mk { position: absolute; border-radius: 50%; background: #fafae8; border: 2px solid #112318; transform-origin: 50% 50%; }
.mk.bag { background: #e3a23b; border-color: #1f4232; }
.mk svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.lbl { position: absolute; text-align: center; font-weight: 700; font-size: 11px; line-height: 12px; color: #112318;
  text-shadow: 0 0 2px #eef3e4, 0 0 2px #eef3e4, 0 0 3px #eef3e4; }
.lbl small { display: block; font-weight: 500; font-size: 9.5px; }
.sheet { position: absolute; overflow: hidden; background: rgba(241,245,234,.96); box-shadow: 0 -2px 24px rgba(17,35,24,.14); }
.sec { color: #5d6b62; }
.tile { position: absolute; border-radius: 13px; background: rgba(17,35,24,.055); }
.finger { position: absolute; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%;
  background: radial-gradient(circle at 50% 45%, rgba(255,255,255,.75), rgba(230,232,226,.55)); border: 1.5px solid rgba(17,35,24,.28);
  box-shadow: 0 6px 18px rgba(17,35,24,.28); z-index: 50; }
.jt { position: absolute; }
.jt .img { position: absolute; left: 0; top: 0; width: 176px; height: 176px; border-radius: 18px; overflow: hidden; background-size: cover; background-position: center; }
.jt .nm { position: absolute; left: 0; top: 184px; font: 600 16px/20px Serif, Georgia, serif; }
.jt .dt { position: absolute; left: 0; top: 205px; font-size: 12px; line-height: 16px; color: #5d6b62; }
.jt .nt { position: absolute; left: 0; top: 221px; font-size: 12px; line-height: 16px; color: #5d6b62; white-space: nowrap; }
.badge { position: absolute; right: 8px; top: 8px; padding: 3px 7px; border-radius: 10px; background: rgba(0,0,0,.35); color: #fff; font-size: 11px; font-weight: 700; }
</style>
</head>
<body>
<div id="stage"><div id="cam"></div><div id="fx"></div></div>
<script>
// ======================= CONFIG =======================
// Mixkit "Rising Forest" (471): beats.py → BPM 124.0102, DROP song beat 32 → MUSIC.offset 9.7051 puts it on film beat 12.
const BPM = 124.0102;
const MUSIC = { file: 'audio/music/471.mp3', offset: 9.7051, gain: 0.75 };
const BEATS = 32;
const W = 1080, H = 1920;
const P = 60 / BPM, B = b => b * P;
const DURATION = B(BEATS) + 0.45;

// ======================= MATH =======================
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const E = {
  lin: t => t,
  io: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  io5: t => t < .5 ? 16 * t ** 5 : 1 - Math.pow(-2 * t + 2, 5) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  out5: t => 1 - Math.pow(1 - t, 5),
  in: t => t * t * t,
};
const pr = (t, a, b, e = E.io) => e(clamp((t - a) / (b - a)));
function sp(t, t0, f = 2.4, z = 0.62) {
  const u = t - t0; if (u <= 0) return 0;
  const w = 2 * Math.PI * f, wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * u) * (Math.cos(wd * u) + (z * w / wd) * Math.sin(wd * u));
}
const rnd = i => { const x = Math.sin(i * 78.233 + 12.9898) * 43758.5453; return x - Math.floor(x); };

// ======================= DOM =======================
function el(tag, cls, parent, html) {
  const e = document.createElement(tag); if (cls) e.className = cls;
  if (html != null) e.innerHTML = html; parent.appendChild(e); return e;
}
function box(e, x, y, w, h) { e.style.left = x + 'px'; e.style.top = y + 'px'; if (w != null) e.style.width = w + 'px'; if (h != null) e.style.height = h + 'px'; }
const vis = (e, on) => { e.style.visibility = on ? 'inherit' : 'hidden'; };
const TF = (e, s) => { e.style.transform = s; };
function riser(parent, x, y, w, h, html) {
  const m = el('div', 'mask', parent); box(m, x, y, w, h);
  const c = el('div', '', m, html); c.style.width = w + 'px'; c.style.height = h + 'px';
  return { m, c };
}
const rise = (r, t, s, dur = 0.35) => TF(r.c, `translateY(${(1 - pr(t, s, s + dur, E.out5)) * 105}%)`);
// rise in at s, leave upward at o
const riseOut = (r, t, s, o, dur = 0.35) => TF(r.c, `translateY(${(1 - pr(t, s, s + dur, E.out5)) * 105 - pr(t, o, o + dur, E.in) * 105}%)`);

// ======================= CAMERA =======================
// World = the 1080x1920 frame; the phone screen sits at (SX, SY), 430x932 points.
const SX = 325, SY = 494, SW = 430, SH = 932;
const CAMK = [
  [0, 2.05, 540, 960, E.lin],
  [5.8, 2.24, 506, 968, E.io],
  [7.6, 1.55, 540, 990, E.io],
  [8.2, 1.55, 540, 990, E.lin],
  [11.7, 2.3, 540, 1232, E.io],
  [12.4, 2.3, 540, 1232, E.lin],
  [13.0, 2.05, 540, 960, E.io],
  [20.95, 2.05, 540, 960, E.lin],
  [22.6, 2.7, 602, 612, E.io5],
];
function camAt(t) {
  const b = t / P;
  if (b <= CAMK[0][0]) return { z: CAMK[0][1], x: CAMK[0][2], y: CAMK[0][3] };
  for (let i = 0; i < CAMK.length - 1; i++) {
    const a = CAMK[i], c = CAMK[i + 1];
    if (b <= c[0]) { const u = c[4]((b - a[0]) / (c[0] - a[0])); return { z: Math.exp(lerp(Math.log(a[1]), Math.log(c[1]), u)), x: lerp(a[2], c[2], u), y: lerp(a[3], c[3], u) }; }
  }
  const k = CAMK[CAMK.length - 1]; return { z: k[1], x: k[2], y: k[3] };
}
const toScreen = (c, x, y) => ({ x: W / 2 + (x - c.x) * c.z, y: H / 2 + (y - c.y) * c.z });
function press(t, beat) {
  const d = t - B(beat); if (d < -0.12 || d > 0.35) return 0;
  return d < 0 ? E.out((d + 0.12) / 0.12) : 1 - sp(t, B(beat), 3.2, 0.55);
}

// ======================= SOUND =======================
const SFX = [];
const sfx = (f, beat, v = 0.5, peak = false) => SFX.push({ f, t: B(beat), v, peak });

// ======================= DATA =======================
const AREAS = ['Eastern', 'Far Eastern', 'Central', 'Southern', 'Northern', 'North Western', 'Western'];
const BOOKW = ['One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven'];
const TOTAL = [35, 36, 27, 30, 24, 29, 33];
const DONE = [9, 6, 11, 7, 8, 4, 2];               // 47 before Great Gable
const MUST = ['helvellyn', 'tarn-crag-easedale', 'scafell-pike', 'skiddaw', 'catbells'];
const AY = 440;                                      // map anchor: screen y of the map centre
const S0 = SW / 39000, S1 = SW / 3000;               // px per metre: whole district, Great Gable close-up
const OVC = { e: 329000, n: 515500 };
const GGP1 = { x: 215, y: 392 };                     // where the Great Gable pin ends on screen

// ======================= SCENE =======================
const cam = document.getElementById('cam'), fx = document.getElementById('fx');
for (const e of [document.documentElement, document.body, cam]) { e.style.width = W + 'px'; e.style.height = H + 'px'; }
const ICON_MTN = c => `<svg viewBox="0 0 24 24"><path d="M2 19 L9 8 L13 14 L15.5 10.5 L22 19 Z" fill="${c}"/></svg>`;
const TICK = (c, w = 2.6) => `<svg viewBox="0 0 26 26"><path d="M7.5 13.5 L11.5 17.5 L19 9.5" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
// The app's ContourArtwork: wobbly closed rings, every fifth heavier (Pro/ContourArtwork.swift).
function contourSVG(w, h, cx, cy, rings, spacing, color, k = 1) {
  let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="position:absolute;left:0;top:0">`;
  const ring = (x0, y0, n, sp_, ph) => {
    for (let r = 1; r <= n; r++) {
      let d = '';
      for (let i = 0; i <= 96; i++) {
        const a = i / 96 * 2 * Math.PI, wob = 1 + 0.13 * Math.sin(3 * a + ph + r * 0.35) + 0.07 * Math.cos(5 * a - r * 0.22);
        d += (i ? 'L' : 'M') + (x0 + Math.cos(a) * r * sp_ * wob * 1.25).toFixed(1) + ' ' + (y0 + Math.sin(a) * r * sp_ * wob).toFixed(1);
      }
      const idx = r % 5 === 0;
      s += `<path d="${d}" fill="none" stroke="${color}" stroke-opacity="${idx ? 0.3 : 0.14}" stroke-width="${(idx ? 1.4 : 0.8) * k}"/>`;
    }
  };
  ring(cx, cy, rings, spacing, 0.4); ring(w - cx * 0.75, cy * 0.3, Math.max(3, rings >> 1), spacing * 0.9, 2.1);
  return s + '</svg>';
}

let F, GG, marks = [], labels = [], mapImgs, S;  // built in build()
function build(data) {
  F = data.fells; const OV = data.OV, DT = data.DT;
  GG = F.find(f => f.id === 'great-gable');
  // bagged set: the required journal fells first, then a deterministic pick per book
  F.forEach((f, i) => { f.ai = AREAS.indexOf(f.area); f.i = i; });
  for (let a = 0; a < 7; a++) {
    const inA = F.filter(f => f.ai === a && f.id !== 'great-gable');
    inA.sort((p, q) => (MUST.includes(q.id) - MUST.includes(p.id)) || rnd(p.book) - rnd(q.book));
    inA.slice(0, DONE[a]).forEach(f => f.bag = true);
  }
  const byH = [...F].sort((p, q) => q.m - p.m); GG.rank = byH.indexOf(GG) + 1;

  // --- phone
  const phone = el('div', '', cam); phone.id = 'phone'; box(phone, SX - 13, SY - 13, SW + 26, SH + 26);
  const scr = el('div', '', cam); scr.id = 'scr'; box(scr, SX, SY, SW, SH);
  // --- map screen
  const mapS = el('div', 'abs', scr); box(mapS, 0, 0, SW, SH);
  const map = el('div', '', mapS); map.id = 'map';
  const ov = el('img', '', map); ov.src = 'assets/map_overview.jpg';
  const dt = el('img', '', map); dt.src = 'assets/map_detail.jpg';
  mapImgs = [[ov, OV], [dt, DT]];
  for (const f of F) {
    const m = el('div', 'mk' + (f.bag ? ' bag' : ''), map);
    if (f.bag) m.innerHTML = TICK('#1f4232', 3.2);
    marks.push(m);
  }
  const ggBag = el('div', 'abs', map); ggBag.style.cssText += 'border-radius:50%;background:#e3a23b;border:2px solid #1f4232';
  ggBag.innerHTML = TICK('#1f4232', 3.2);
  const pin = el('div', 'abs', map, `<svg width="54" height="64" viewBox="0 0 54 64" style="position:absolute;left:0;top:0">
    <path d="M20 50 L27 60 L34 50 Z" fill="#112318"/><circle cx="27" cy="27" r="24" fill="#112318"/><circle cx="27" cy="27" r="20.5" fill="#f1f0e2"/>
    <path d="M14 36 L22.5 22 L27.5 29.5 L30.5 25 L40 36 Z" fill="#1f4232"/></svg>`);
  const pinBag = el('div', 'abs', pin, `<svg width="54" height="64" viewBox="0 0 54 64" style="position:absolute;left:0;top:0">
    <circle cx="27" cy="27" r="20.5" fill="#e3a23b"/><path d="M18.5 27.5 L24.5 33.5 L36 21.5" fill="none" stroke="#1f4232" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`);
  // labels: [id, rise beat] (big four), others appear with the close-up
  const L = [['scafell-pike', 4], ['helvellyn', 4], ['skiddaw', 4.5], ['great-gable', 4.5],
    ['kirk-fell', -1], ['great-end', -1], ['lingmell', -1], ['haystacks-buttermere', -1], ['fleetwith-pike', -1], ['brandreth', -1], ['base-brown', -1], ['grey-knotts', -1]];
  for (const [id, bt] of L) {
    const f = F.find(x => x.id === id); if (!f) continue;
    const r = riser(map, 0, 0, 120, 26, `<div class="lbl" style="width:120px">${f.name.replace(/ \(.*\)/, '')}<small>${Math.round(f.m)} m</small></div>`);
    labels.push({ f, bt, r });
  }
  // status bar + island + map controls
  const island = el('div', 'abs', scr); island.style.cssText += 'background:#000;border-radius:19px;z-index:30'; box(island, 152, 11, 126, 37);
  const sb = el('div', 'abs', scr, `<div style="position:absolute;left:52px;top:17px;font-weight:700;font-size:17px">9:41</div>
    <svg style="position:absolute;left:318px;top:21px" width="86" height="14" viewBox="0 0 86 14"><rect x="0" y="8" width="3.5" height="5" rx="1" fill="#112318"/><rect x="5.5" y="6" width="3.5" height="7" rx="1" fill="#112318"/><rect x="11" y="3.5" width="3.5" height="9.5" rx="1" fill="#112318"/><rect x="16.5" y="1" width="3.5" height="12" rx="1" fill="#112318"/>
    <path d="M33 5.5 a11 11 0 0 1 15 0 M36 8.6 a6.5 6.5 0 0 1 9 0" stroke="#112318" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="40.5" cy="11.6" r="1.6" fill="#112318"/>
    <rect x="57" y="1" width="25" height="12" rx="3.5" stroke="#112318" stroke-opacity=".4" fill="none"/><rect x="59" y="3" width="19" height="8" rx="2" fill="#112318"/><rect x="83" y="5" width="1.8" height="4" rx=".8" fill="#112318" fill-opacity=".4"/></svg>`);
  sb.style.zIndex = 29; box(sb, 0, 0, SW, 54);
  el('div', 'abs', mapS, `<div style="position:absolute;left:0;top:0;width:48px;height:96px;border-radius:24px;background:rgba(244,247,238,.94);box-shadow:0 2px 10px rgba(17,35,24,.12)">
    <div style="position:absolute;top:13px;width:48px;text-align:center;font-weight:700;font-size:16px">2D</div>
    <div style="position:absolute;left:10px;top:48px;width:28px;height:1px;background:rgba(17,35,24,.12)"></div>
    <svg style="position:absolute;left:13px;top:59px" width="22" height="22" viewBox="0 0 24 24"><path d="M21 3 L3 10.5 L11 13 L13.5 21 Z" fill="none" stroke="#112318" stroke-width="2" stroke-linejoin="round"/></svg></div>
    <div style="position:absolute;left:0;top:108px;width:48px;height:48px;border-radius:24px;background:rgba(244,247,238,.94);box-shadow:0 2px 10px rgba(17,35,24,.12)">
    <svg style="position:absolute;left:14px;top:9px" width="20" height="30" viewBox="0 0 20 30"><path d="M10 8 L15 22 L10 19 Z" fill="#5d6b62"/><path d="M10 8 L5 22 L10 19 Z" fill="#112318" fill-opacity=".3"/><text x="10" y="7" text-anchor="middle" font-size="8" font-weight="700" fill="#112318">N</text></svg></div>`).style.cssText += 'left:370px;top:72px';

  // --- the sheet: progress (collapsed) → fell card (expanded)
  const sheet = el('div', 'sheet', mapS); S = { sheet };
  el('div', 'abs', sheet).style.cssText += 'left:187px;top:7px;width:36px;height:5px;border-radius:3px;background:rgba(17,35,24,.2)';
  const prog = el('div', 'abs', sheet); S.prog = prog; box(prog, 0, 0, 410, 150);
  prog.innerHTML = `<div class="abs" style="left:14px;top:20px;width:318px;height:44px;border-radius:22px;background:rgba(17,35,24,.07)">
      <svg style="position:absolute;left:14px;top:12px" width="20" height="20" viewBox="0 0 24 24"><circle cx="10" cy="10" r="7" fill="none" stroke="#5d6b62" stroke-width="2.2"/><path d="M15.5 15.5 L21 21" stroke="#5d6b62" stroke-width="2.4" stroke-linecap="round"/></svg>
      <div style="position:absolute;left:44px;top:11px;font-size:17px;color:#7c8a81">Search 214 fells</div></div>
    <div class="abs" style="left:344px;top:18px;width:48px;height:48px;border-radius:50%;background:#5c946f;overflow:hidden">
      <div style="position:absolute;left:16px;top:10px;width:16px;height:16px;border-radius:50%;background:#fafae8"></div><div style="position:absolute;left:8px;top:30px;width:32px;height:30px;border-radius:50%;background:#fafae8"></div></div>
    <svg class="abs" style="left:14px;top:78px" width="60" height="60" viewBox="0 0 60 60"><circle cx="30" cy="30" r="26" fill="none" stroke="rgba(62,110,84,.16)" stroke-width="5"/>
      <circle cx="30" cy="30" r="26" fill="none" stroke="#e3a23b" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(2 * Math.PI * 26 * 47 / 214).toFixed(1)} 400" transform="rotate(-90 30 30)"/>
      <path d="M16 38 L25 24 L30 31 L33 27 L43 38 Z" fill="#1f4232"/></svg>
    <div class="abs serif" style="left:88px;top:80px;font-size:26px;font-weight:700;line-height:32px">47 of 214</div>
    <div class="abs sec" style="left:88px;top:112px;font-size:16px">167 to go</div>`;
  // card content, each piece on its own mask line
  const C = S.card = {};
  C.title = riser(sheet, 22, 26, 300, 42, `<div class="serif" style="font-size:32px;font-weight:700;line-height:42px;letter-spacing:-0.01em">Great Gable</div>`);
  C.close = el('div', 'abs', sheet, `<svg width="34" height="34" viewBox="0 0 34 34"><circle cx="17" cy="17" r="17" fill="rgba(17,35,24,.08)"/><path d="M12 12 L22 22 M22 12 L12 22" stroke="#3d4a42" stroke-width="2.2" stroke-linecap="round"/></svg>`); box(C.close, 354, 28, 34, 34);
  C.sub = riser(sheet, 22, 70, 340, 22, `<div class="sec" style="font-size:15px;line-height:22px">The Western Fells · Book Seven</div>`);
  const tiles = [['Height', `${Math.round(GG.m)} m`, `${GG.ft.toLocaleString('en-GB')} ft`], ['Book', 'Seven', 'Western'], ['Rank', `#${GG.rank}`, 'by height']];
  C.tiles = tiles.map(([a, v, s], i) => { const d = el('div', 'tile', sheet); box(d, 22 + i * 125, 104, 116, 78);
    d.innerHTML = `<div class="abs sec" style="left:12px;top:9px;font-size:12px">${a}</div><div class="abs" style="left:12px;top:25px;font-size:20px;font-weight:700">${v}</div><div class="abs sec" style="left:12px;top:52px;font-size:12px">${s}</div>`; return d; });
  C.dateRow = riser(sheet, 22, 196, 366, 44, `<div class="abs" style="left:0;top:11px;font-size:16px">Date walked</div>`);
  C.pill = el('div', 'abs', C.dateRow.c); C.pill.style.cssText += 'border-radius:19px;background:rgba(17,35,24,.08);overflow:hidden'; box(C.pill, 226, 3, 140, 38);
  C.d1 = el('div', 'abs', C.pill, '<div style="width:140px;text-align:center;font-size:16px;line-height:38px">28 Sep 2026</div>');
  C.d2 = el('div', 'abs', C.pill, '<div style="width:140px;text-align:center;font-size:16px;line-height:38px;font-weight:600">26 Sep 2026</div>');
  C.btn = el('div', 'abs', sheet, `<div style="position:absolute;inset:0;border-radius:29px;background:#3e6e54"></div>
    <div style="position:absolute;left:0;top:0;width:366px;height:58px;display:flex;align-items:center;justify-content:center;gap:10px;color:#fff;font-size:18px;font-weight:600">
    <svg width="22" height="22" viewBox="0 0 26 26"><circle cx="13" cy="13" r="12" fill="#fff"/><path d="M7.5 13.5 L11.5 17.5 L19 9.5" fill="none" stroke="#3e6e54" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Bag it</div>`);
  box(C.btn, 22, 256, 366, 58);

  // --- journal screen
  const jS = el('div', 'abs', scr); S.journal = jS; box(jS, 0, 0, SW, SH); jS.style.background = '#f3f1e4';
  el('div', 'abs', jS, `<svg width="12" height="20" viewBox="0 0 12 20" style="position:absolute;left:0;top:2px"><path d="M10 2 L2 10 L10 18" fill="none" stroke="#3e6e54" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span style="position:absolute;left:18px;top:0;font-size:17px;color:#3e6e54">Map</span>`).style.cssText += 'left:16px;top:64px';
  el('div', 'abs', jS, '<div style="width:430px;text-align:center;font-size:17px;font-weight:700">Journal</div>').style.cssText += 'left:0;top:64px';
  S.year = riser(jS, 33, 100, 200, 46, '<div class="serif" style="font-size:36px;font-weight:600;line-height:46px">2026</div>');

    riseOut(r, t, B(s0 + i * 0.375), B(26.5 + i * 0.05)); vis(r.m, t >= B(s0) - 0.01 && t < B(27.2)); });
}
