<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@800;900&display=block">
<style>
  html, body { margin: 0; background: #16161C; color: #eee; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; }
  #out { width: min(100%, 1280px); aspect-ratio: 16 / 9; height: auto; background: #F4EEE2; }
  .p5Canvas { display: none !important; }
  .bar { display: flex; gap: 10px; align-items: center; max-width: 1280px; }
  #scrub { flex: 1; }
  #tt { font-variant-numeric: tabular-nums; min-width: 190px; }
</style>
<script src="node_modules/p5/lib/p5.min.js"></script>
<script src="node_modules/p5.brush/dist/p5.brush.js"></script>
</head>
<body>
<main>
  <canvas id="out" width="1920" height="1080"></canvas>
  <div class="bar"><input id="scrub" type="range" min="0" max="600" step="0.0417" value="0"><span id="tt">loading…</span> <span>space = play</span></div>
</main>
<script src="src/song.js"></script>
<script src="src/core.js"></script>
<!-- the project's rigs and set: hero, singer/cast, props -->
<script src="src/hero.js"></script>
<script src="src/cast.js"></script>
<script src="src/props.js"></script>
<script src="src/timeline.js"></script>
<!-- one line per chapter, in time order -->
<script src="src/ch/c0_title.js"></script>
<script src="src/gallery.js"></script>
</body>
</html>
