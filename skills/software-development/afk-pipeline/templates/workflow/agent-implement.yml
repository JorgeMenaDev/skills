name: Agent Implement

# AFK Task pipeline (implement → advisory review → verify → draft PR → best-effort recap).
# GENERATED from the afk-pipeline skill's templates/ — repo-specific values live
# in .sandcastle/config/; edit there and re-run the generator, never this file.
# Decisions: matias repo docs/adr/0002 + 0003.

on:
  issues:
    types: [labeled]

# Pin the recap CLI to an exact version (never @latest). Shared by the recap
# job's install (via RECAP_CLI_VERSION env) and the Playwright browser cache key
# so a CLI bump busts the cache. Bump deliberately when adopting a new recap CLI.
env:
  RECAP_CLI_VERSION: "0.85.6"
  AGENT_BROWSER_VERSION: "{{AGENT_BROWSER_VERSION}}"

jobs:
  implement:
    # Three lanes, one pipeline: `agent:implement` → cloud-hosted VM (noSandbox),
    # `agent:implement-local` → self-hosted Mac mini (agent inside Docker),
    # `agent:implement-sandbox` → cloud-hosted runner + Vercel Sandbox microVM
    # (the AGENT runs inside via sandcastle's isolated provider — workspace
    # syncs in/out by git bundle/format-patch, so every workflow step here
    # stays host-side on all three lanes; ADR 0004, .sandcastle/vercel/provider.ts).
    # The non-local runner is per-repo config (v2.7.0): pipeline.json
    # `cloudRunsOn` — GitHub's `ubuntu-latest` (default) or a Blacksmith tag
    # (e.g. `blacksmith-4vcpu-ubuntu-2404`, requires the Blacksmith GitHub App
    # on the repo's org). A tag no runner backs queues the job forever — the
    # first run after flipping this validates it.
    if: github.event.label.name == 'agent:implement' || github.event.label.name == 'agent:implement-local' || github.event.label.name == 'agent:implement-sandbox'
    runs-on: ${{ github.event.label.name == 'agent:implement-local' && 'self-hosted' || '{{CLOUD_RUNS_ON}}' }}
    timeout-minutes: 120
    concurrency:
      group: agent-implement-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write

    # Handoff to the separate `recap` job (runs on a GitHub-hosted VM regardless
    # of which lane implemented, so it must be told the PR + branch explicitly).
    # `recap` carries the parsed Pipeline Flag so the recap job's `if:` can skip
    # the whole job — before any install — when the brief says `recap: off`.
    outputs:
      pr_url: ${{ steps.open_pr.outputs.pr_url }}
      pr_number: ${{ steps.open_pr.outputs.pr_number }}
      branch: ${{ steps.branch.outputs.name }}
      recap: ${{ steps.flags.outputs.recap }}
      engine: ${{ steps.flags.outputs.engine }}

    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SANDCASTLE_SANDBOX: ${{ github.event.label.name == 'agent:implement-local' && 'docker' || (github.event.label.name == 'agent:implement-sandbox' && 'vercel' || 'none') }}
      # Sandbox lane auth (empty/unused on the other lanes). Team/project IDs
      # are baked into .sandcastle/vercel/provider.ts from pipeline.json
      # `sandbox:` at generate time; the provider reads this token from env.
      VERCEL_SANDBOX_TOKEN: ${{ secrets.VERCEL_SANDBOX_TOKEN }}

    steps:
      - name: Pre-flight — refuse if an open PR already exists for this issue
        id: preflight
        run: |
          set -euo pipefail
          existing=$(gh pr list \
            --state open \
            --search "in:body \"#${ISSUE_NUMBER}\"" \
            --json number,url,body \
            --jq "[.[] | select(.body | test(\"(?i)(closes|fixes|resolves)\\\\s+#${ISSUE_NUMBER}\\\\b\"))]")
          count=$(echo "$existing" | jq 'length')
          if [ "$count" -gt 0 ]; then
            url=$(echo "$existing" | jq -r '.[0].url')
            echo "existing_pr_url=$url" >> "$GITHUB_OUTPUT"
            echo "refused=true" >> "$GITHUB_OUTPUT"
          else
            echo "refused=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pre-flight refusal — comment + remove label, exit
        if: steps.preflight.outputs.refused == 'true'
        env:
          EXISTING_PR_URL: ${{ steps.preflight.outputs.existing_pr_url }}
          TRIGGER_LABEL: ${{ github.event.label.name }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --remove-label "$TRIGGER_LABEL" || true
          gh issue comment "$ISSUE_NUMBER" --body "Refused to run: PR $EXISTING_PR_URL already targets this issue. Close it first, then re-add \`$TRIGGER_LABEL\`."
          exit 0

      - name: Transition labels — remove implement/blocked, add in-progress
        if: steps.preflight.outputs.refused != 'true'
        run: |
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement" || true
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement-local" || true
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:implement-sandbox" || true
          gh issue edit "$ISSUE_NUMBER" --remove-label "agent:blocked" || true
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:in-progress"

      - name: Checkout base branch
        if: steps.preflight.outputs.refused != 'true'
        uses: actions/checkout@v4
        with:
          ref: {{BASE_BRANCH}}
          fetch-depth: 0
          # AGENT_PAT so pushes may touch .github/workflows/ (GITHUB_TOKEN
          # lacks the workflow scope). Falls back to GITHUB_TOKEN if unset.
          token: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}

      - name: Compute branch name
        if: steps.preflight.outputs.refused != 'true'
        id: branch
        run: |
          slug=$(echo "$ISSUE_TITLE" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' \
            | cut -c1-50)
          branch="agent/issue-${ISSUE_NUMBER}-${slug}"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Create branch
        if: steps.preflight.outputs.refused != 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          # Author pipeline commits with a real GitHub identity so Vercel can
          # map the commit author to an account (bot noreply emails fail the
          # preview-deploy check). Set once here, before the implement/verify
          # phases commit — this step runs on both lanes (no lane conditional).
          git config user.name "JorgeMenaDev"
          git config user.email "77608748+JorgeMenaDev@users.noreply.github.com"
          git checkout -b "$BRANCH"

      - name: Setup Bun
        if: steps.preflight.outputs.refused != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "{{BUN_VERSION}}"

      - name: Parse Pipeline Flags from the Agent Brief
        # Reads the `### Pipeline` section (verify: full|slim|off, recap: on|off,
        # review/recording: on|off, engine: claude|codex|cursor,
        # review-engine: codex|claude)
        # from the issue body and exposes the parsed set as step outputs. The
        # parser is fail-safe: an absent section / unknown key / bad value falls
        # back to the full-pipeline defaults. Lives in .sandcastle so it travels
        # with the pipeline; uses only Bun builtins (no node_modules yet).
        if: steps.preflight.outputs.refused != 'true'
        id: flags
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: bun .sandcastle/flags/parse-flags.ts | tee "${RUNNER_TEMP}/flags-echo.md"

      - name: Echo parsed Pipeline Flags on the issue
        # Surface the parsed flag set immediately so a misparse is visible before
        # the phases run; retriggering re-reads the same body.
        if: steps.preflight.outputs.refused != 'true'
        run: gh issue comment "$ISSUE_NUMBER" --body-file "${RUNNER_TEMP}/flags-echo.md"

      - name: Validate recorded verification flags
        if: steps.preflight.outputs.refused != 'true' && steps.flags.outputs.recording == 'on'
        env:
          VERIFY_MODE: ${{ steps.flags.outputs.verify }}
        run: |
          set -euo pipefail
          fail() {
            echo "$1" > "${RUNNER_TEMP}/failure_reason.txt"
            echo "$1" >&2
            exit 1
          }
          [ "$VERIFY_MODE" != "off" ] || fail "Invalid Pipeline Flags: recording=on requires verify=full or verify=slim."
          [ "$SANDCASTLE_SANDBOX" != "docker" ] || fail "Invalid Pipeline Flags: recording=on is hosted-only in v1; use the cloud or Vercel Sandbox lane."

      - name: Assert review engine differs from Codex implementation default
        if: steps.preflight.outputs.refused != 'true'
        env:
          ENGINE: ${{ steps.flags.outputs.engine }}
          REVIEW_ENGINE: ${{ steps.flags.outputs.review_engine }}
          REVIEW_ENGINE_STATUS: ${{ steps.flags.outputs.review_engine_status }}
        run: |
          set -euo pipefail
          if [ "$ENGINE" = "codex" ] && [ "$REVIEW_ENGINE" = "codex" ] && [ "$REVIEW_ENGINE_STATUS" != "set" ]; then
            reason="Invalid Pipeline Flags: engine=codex resolved review-engine=codex without an explicit review-engine override. The default must stay cross-vendor."
            echo "$reason" > "${RUNNER_TEMP}/failure_reason.txt"
            echo "$reason" >&2
            exit 1
          fi

      - name: Pre-flight Cursor engine
        if: steps.preflight.outputs.refused != 'true' && steps.flags.outputs.engine == 'cursor'
        env:
          CURSOR_API_KEY: ${{ steps.flags.outputs.engine == 'cursor' && secrets.CURSOR_API_KEY || '' }}
        run: |
          set -euo pipefail
          fail() {
            echo "$1" > "${RUNNER_TEMP}/failure_reason.txt"
            echo "$1" >&2
            exit 1
          }
          [ "$SANDCASTLE_SANDBOX" = "none" ] || fail "engine: cursor is cloud-lane only (v1) — local Docker images and the microVM bootstrap lack the Cursor CLI"
          [ -n "$CURSOR_API_KEY" ] || fail "Cursor preflight failed: CURSOR_API_KEY repo secret is missing for engine=cursor."

      - name: Install dependencies
        if: steps.preflight.outputs.refused != 'true'
        run: bun install --frozen-lockfile

      - name: Install Claude Code (hosted lanes needing host Claude)
        if: steps.preflight.outputs.refused != 'true' && env.SANDCASTLE_SANDBOX != 'docker' && (env.SANDCASTLE_SANDBOX == 'none' || steps.flags.outputs.review_engine == 'claude')
        run: |
          set -euo pipefail
          npm install -g --include=optional @anthropic-ai/claude-code
          node "$(npm root -g)/@anthropic-ai/claude-code/install.cjs"
          claude --version

      - name: Install Codex CLI + materialize auth (hosted lanes needing Codex)
        if: steps.preflight.outputs.refused != 'true' && (steps.flags.outputs.engine == 'codex' || steps.flags.outputs.review_engine == 'codex') && env.SANDCASTLE_SANDBOX != 'docker'
        env:
          CODEX_AUTH_B64: ${{ github.event.label.name != 'agent:implement-local' && secrets.CODEX_AUTH_B64 || '' }}
          ENGINE: ${{ steps.flags.outputs.engine }}
        run: |
          set -euo pipefail
          fail() {
            echo "$1" > "${RUNNER_TEMP}/failure_reason.txt"
            echo "$1" >&2
            exit 1
          }
          npm i -g @openai/codex
          if [ -n "$CODEX_AUTH_B64" ]; then
            mkdir -p "${RUNNER_TEMP}/codex-home"
            printf "%s" "$CODEX_AUTH_B64" | base64 -d > "${RUNNER_TEMP}/codex-home/auth.json" \
              || fail "Codex setup failed: CODEX_AUTH_B64 is not valid base64."
            chmod 600 "${RUNNER_TEMP}/codex-home/auth.json"
          elif [ "$ENGINE" = "codex" ]; then
            fail "Codex setup failed: CODEX_AUTH_B64 repo secret is missing for this hosted codex lane."
          else
            echo "CODEX_AUTH_B64 missing; hosted Codex review will skip advisory review instead of failing the run." >&2
          fi

      - name: Install Cursor CLI (cloud cursor lane)
        if: steps.preflight.outputs.refused != 'true' && steps.flags.outputs.engine == 'cursor'
        run: |
          set -euo pipefail
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install agent-browser + Chrome (cloud lane)
        if: steps.preflight.outputs.refused != 'true' && env.SANDCASTLE_SANDBOX == 'none'
        run: |
          bun add -g "agent-browser@${AGENT_BROWSER_VERSION}"
          agent-browser install --with-deps

      - name: Ensure sandbox image (local lane)
        if: steps.preflight.outputs.refused != 'true' && env.SANDCASTLE_SANDBOX == 'docker'
        run: |
          docker image inspect {{IMAGE_NAME}} > /dev/null 2>&1 \
            || docker build -t {{IMAGE_NAME}} .sandcastle/

      - name: Pre-flight Codex engine
        if: steps.preflight.outputs.refused != 'true' && steps.flags.outputs.engine == 'codex'
        env:
          CODEX_AUTH_B64: ${{ github.event.label.name != 'agent:implement-local' && secrets.CODEX_AUTH_B64 || '' }}
        run: |
          set -euo pipefail
          fail() {
            echo "$1" > "${RUNNER_TEMP}/failure_reason.txt"
            echo "$1" >&2
            exit 1
          }
          if [ "$SANDCASTLE_SANDBOX" = "docker" ]; then
            [ -f "$HOME/.codex-afk/auth.json" ] || fail "Codex preflight failed: local lane missing $HOME/.codex-afk/auth.json. Seed it with a one-time CODEX_HOME=$HOME/.codex-afk codex login."
            [ -r "$HOME/.codex-afk/auth.json" ] || fail "Codex preflight failed: $HOME/.codex-afk/auth.json is not readable by the runner user."
            [ -w "$HOME/.codex-afk" ] || fail "Codex preflight failed: $HOME/.codex-afk is not writable by the runner user."
            docker run --rm --entrypoint sh {{IMAGE_NAME}} -lc 'command -v codex >/dev/null' \
              || fail "Codex preflight failed: codex CLI is missing from the local sandbox image. Rebuild {{IMAGE_NAME}} from .sandcastle/Dockerfile."
          else
            [ -n "$CODEX_AUTH_B64" ] || fail "Codex preflight failed: CODEX_AUTH_B64 repo secret is missing for this hosted codex lane."
          fi

      - name: Acquire Codex host lock (local lane)
        if: steps.preflight.outputs.refused != 'true' && steps.flags.outputs.engine == 'codex' && env.SANDCASTLE_SANDBOX == 'docker'
        run: |
          set -euo pipefail
          lock="$HOME/.codex-afk/.lock"
          deadline=$((SECONDS + 900))
          while ! mkdir "$lock" 2>/dev/null; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              reason="Codex local lane lock busy for 15 minutes: $lock"
              echo "$reason" > "${RUNNER_TEMP}/failure_reason.txt"
              echo "$reason" >&2
              exit 1
            fi
            sleep 10
          done
          {
            echo "repo=$GITHUB_REPOSITORY"
            echo "run=$GITHUB_RUN_ID"
            echo "issue=$ISSUE_NUMBER"
            date -u +"acquired_at=%Y-%m-%dT%H:%M:%SZ"
          } > "$lock/owner"

      - name: Codex auth smoke
        if: steps.preflight.outputs.refused != 'true' && steps.flags.outputs.engine == 'codex'
        run: |
          set -euo pipefail
          fail() {
            echo "$1" > "${RUNNER_TEMP}/failure_reason.txt"
            echo "$1" >&2
            exit 1
          }
          if [ "$SANDCASTLE_SANDBOX" = "docker" ]; then
            if ! docker run --rm --entrypoint sh \
              -v "$HOME/.codex-afk:/home/agent/.codex" \
              -v "$PWD:/workspace" \
              -w /workspace \
              -e CODEX_HOME=/home/agent/.codex \
              {{IMAGE_NAME}} \
              -lc 'timeout 120 codex exec --json "Reply OK"' \
              > "${RUNNER_TEMP}/codex-smoke.json" 2> "${RUNNER_TEMP}/codex-smoke.err"; then
              tail -n 40 "${RUNNER_TEMP}/codex-smoke.err" >&2 || true
              fail "Codex auth smoke failed before implement. Check CODEX_HOME auth; 401/auth failures require reseeding ~/.codex-afk or CODEX_AUTH_B64."
            fi
          else
            if ! CODEX_HOME="${RUNNER_TEMP}/codex-home" timeout 120 codex exec --json "Reply OK" \
              > "${RUNNER_TEMP}/codex-smoke.json" 2> "${RUNNER_TEMP}/codex-smoke.err"; then
              tail -n 40 "${RUNNER_TEMP}/codex-smoke.err" >&2 || true
              fail "Codex auth smoke failed before implement. Check CODEX_AUTH_B64; 401/auth failures require rerunning dispatch to reseed the secret."
            fi
          fi

      - name: Cursor auth/model smoke
        if: steps.preflight.outputs.refused != 'true' && steps.flags.outputs.engine == 'cursor'
        env:
          CURSOR_API_KEY: ${{ steps.flags.outputs.engine == 'cursor' && secrets.CURSOR_API_KEY || '' }}
          CURSOR_MODEL: ${{ vars.CURSOR_MODEL || 'grok-4.5-xhigh' }}
        run: |
          set -euo pipefail
          fail() {
            echo "$1" > "${RUNNER_TEMP}/failure_reason.txt"
            echo "$1" >&2
            exit 1
          }
          target_model="${CURSOR_MODEL:-grok-4.5-xhigh}"
          [ "$SANDCASTLE_SANDBOX" = "none" ] || fail "engine: cursor is cloud-lane only (v1) — local Docker images and the microVM bootstrap lack the Cursor CLI"
          [ -n "$CURSOR_API_KEY" ] || fail "cursor auth/model failure: CURSOR_API_KEY repo secret is missing for engine=cursor."
          if ! agent models > "${RUNNER_TEMP}/cursor-models.txt" 2> "${RUNNER_TEMP}/cursor-models.err"; then
            tail -n 40 "${RUNNER_TEMP}/cursor-models.err" >&2 || true
            fail "cursor auth/model failure: agent models failed. Check CURSOR_API_KEY and Cursor CLI auth."
          fi
          grep -F "$target_model" "${RUNNER_TEMP}/cursor-models.txt" >/dev/null \
            || fail "cursor auth/model failure: target model '$target_model' was not listed by agent models."

      - name: Run implement phase
        if: steps.preflight.outputs.refused != 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CODEX_AUTH_B64: ${{ github.event.label.name != 'agent:implement-local' && secrets.CODEX_AUTH_B64 || '' }}
          CURSOR_API_KEY: ${{ steps.flags.outputs.engine == 'cursor' && secrets.CURSOR_API_KEY || '' }}
          CURSOR_MODEL: ${{ vars.CURSOR_MODEL || 'grok-4.5-xhigh' }}
          ENGINE: ${{ steps.flags.outputs.engine }}
          BRANCH: ${{ steps.branch.outputs.name }}
          OUTPUT_DIR: ${{ runner.temp }}
        run: bun .sandcastle/implement/implement.ts

      - name: Second-model review (advisory)
        # Runs the repo's vendored autoreview skill against the branch diff
        # BEFORE verify, so the disposition pass and the QA Evidence both cover
        # reviewed code. Review engine defaults to the opposite vendor from the
        # selected implementation engine; Cursor implement follows the Claude
        # default (`review-engine: codex`). Explicit `review-engine` overrides
        # are allowed and visible. No silent fallback: requested engine missing
        # on the runner ⇒ loud skipped note, never a quiet engine swap.
        # Advisory by construction: review.ts always
        # exits 0 and every degrade path (skill missing, no engine, engine
        # crash) becomes a summary note — continue-on-error is a second belt.
        # Skipped entirely when the brief says `review: off`.
        if: steps.preflight.outputs.refused != 'true' && steps.flags.outputs.review != 'off'
        id: review
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CODEX_AUTH_B64: ${{ github.event.label.name != 'agent:implement-local' && secrets.CODEX_AUTH_B64 || '' }}
          ENGINE: ${{ steps.flags.outputs.engine == 'cursor' && 'claude' || steps.flags.outputs.engine }}
          BRANCH: ${{ steps.branch.outputs.name }}
          OUTPUT_DIR: ${{ runner.temp }}
          REVIEW_ENGINE: ${{ steps.flags.outputs.review_engine }}
        run: bun .sandcastle/review/review.ts

      - name: Review disposition pass (fix blockers or justify)
        # Only when the reviewer flagged findings: a fresh agent session fixes
        # real blocker/major findings or rejects them with a one-line rationale,
        # records the disposition table in the evidence dir, and commits on the
        # branch. Best-effort: a crash leaves the implement commits intact.
        if: steps.preflight.outputs.refused != 'true' && steps.review.outputs.has_findings == 'true'
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CODEX_AUTH_B64: ${{ github.event.label.name != 'agent:implement-local' && secrets.CODEX_AUTH_B64 || '' }}
          ENGINE: ${{ steps.flags.outputs.engine == 'cursor' && 'claude' || steps.flags.outputs.engine }}
          BRANCH: ${{ steps.branch.outputs.name }}
          OUTPUT_DIR: ${{ runner.temp }}
        run: bun .sandcastle/review/review-fix.ts

      - name: Comment review outcome on the issue
        if: steps.preflight.outputs.refused != 'true' && steps.flags.outputs.review != 'off'
        continue-on-error: true
        run: |
          [ -f "${RUNNER_TEMP}/review-summary.md" ] && gh issue comment "$ISSUE_NUMBER" --body-file "${RUNNER_TEMP}/review-summary.md" || true

      - name: Convex integrity gate (real codegen + anonymous schema validation)
        # Regenerates Convex _generated with REAL codegen against a keyless
        # anonymous local backend (CONVEX_AGENT_MODE=anonymous) and fails the
        # RUN when committed files diverge or the schema/functions don't push
        # cleanly — hand-applied codegen (acredix PR #72 incident, 2026-07-05)
        # cannot reach the merge. Runs after the review disposition pass so
        # every code-committing phase is covered, and before verify/push so a
        # corrupted branch never ships. Repos without Convex leave convexDir
        # empty in .sandcastle/config and this step self-skips instantly.
        if: steps.preflight.outputs.refused != 'true'
        env:
          OUTPUT_DIR: ${{ runner.temp }}
        run: bun .sandcastle/implement/convex-gate.ts

      - name: Run verify phase (e2e, agent-browser)
        # Verify Profile from the parsed flags: `off` skips this step entirely
        # (no QA Evidence — the degrade mode is picked up by write-pr and the
        # completion comment); `slim` narrows the sweep to 2 viewports; `full`
        # (default) keeps the full sweep. One prompt template, parameterized by
        # env — never a per-profile prompt file.
        if: steps.preflight.outputs.refused != 'true' && steps.flags.outputs.verify != 'off'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CODEX_AUTH_B64: ${{ github.event.label.name != 'agent:implement-local' && secrets.CODEX_AUTH_B64 || '' }}
          ENGINE: ${{ steps.flags.outputs.engine == 'cursor' && 'claude' || steps.flags.outputs.engine }}
          BRANCH: ${{ steps.branch.outputs.name }}
          OUTPUT_DIR: ${{ runner.temp }}
          VERIFY_MODE: ${{ steps.flags.outputs.verify }}
          RECORDING_MODE: ${{ steps.flags.outputs.recording }}
          VERIFY_VIEWPORTS: ${{ steps.flags.outputs.verify == 'slim' && '1440x900, 390x844' || '390x844, 768x1024, 1440x900, 1920x1080' }}
          VERIFY_LOCALES: ${{ steps.flags.outputs.verify == 'slim' && 'diff' || 'all' }}
          # Repo verify-boot secrets (from .sandcastle/config). These must ALSO be
          # listed in .sandcastle/runtime.ts PASSTHROUGH_KEYS — a workflow-step
          # env line alone never reaches the agent (matias registry quirk, cost
          # a failed run on andesphere #26). The generator keeps both in sync.
{{VERIFY_SECRETS_ENV}}
        run: bun .sandcastle/verify/verify.ts

      - name: Install video preview tooling
        if: steps.preflight.outputs.refused != 'true' && success() && steps.flags.outputs.recording == 'on'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Build inline recorded-verification preview
        if: steps.preflight.outputs.refused != 'true' && success() && steps.flags.outputs.recording == 'on'
        id: recording_preview
        run: |
          set -euo pipefail
          video="${RUNNER_TEMP}/recording/issue-${ISSUE_NUMBER}.webm"
          evidence_dir="{{EVIDENCE_DIR}}/issue-${ISSUE_NUMBER}"
          preview="${evidence_dir}/interaction-preview.gif"
          [ -s "$video" ] || { echo "Recorded verification is missing or empty: $video" >&2; exit 1; }
          mkdir -p "$evidence_dir"
          ffmpeg -loglevel error -y -i "$video" -t 12 \
            -vf "fps=8,scale=720:-1:flags=lanczos,split[a][b];[a]palettegen=max_colors=96[p];[b][p]paletteuse=dither=bayer" \
            "$preview"
          max_bytes=$((10 * 1024 * 1024))
          if [ "$(stat -c%s "$preview")" -gt "$max_bytes" ]; then
            ffmpeg -loglevel error -y -i "$video" -t 10 \
              -vf "fps=6,scale=480:-1:flags=lanczos,split[a][b];[a]palettegen=max_colors=64[p];[b][p]paletteuse=dither=bayer" \
              "$preview"
          fi
          [ "$(stat -c%s "$preview")" -le "$max_bytes" ] || { echo "GIF preview exceeds GitHub's 10 MB image limit" >&2; exit 1; }
          git add "$preview"
          git commit -m "docs(evidence): add interaction preview for #${ISSUE_NUMBER}"
          echo "path=$preview" >> "$GITHUB_OUTPUT"

      - name: Upload recorded verification artifact
        if: always() && steps.preflight.outputs.refused != 'true' && steps.flags.outputs.recording == 'on'
        id: recording_artifact
        uses: actions/upload-artifact@v4
        with:
          name: computer-use-proof-issue-${{ github.event.issue.number }}
          path: |
            ${{ runner.temp }}/recording/issue-${{ github.event.issue.number }}.webm
            {{EVIDENCE_DIR}}/issue-${{ github.event.issue.number }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Push branch
        if: steps.preflight.outputs.refused != 'true' && success()
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        # Force-push recovers from orphan branches whose PR has since closed —
        # safe because preflight refuses when an open PR exists for this issue.
        # All lanes: commits land on the HOST checkout (bind-mount on docker,
        # sandcastle sync-out on the vercel lane), so this push is host-side.
        run: git push --force origin "$BRANCH"

      - name: Write PR title and description
        if: steps.preflight.outputs.refused != 'true' && success()
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CODEX_AUTH_B64: ${{ github.event.label.name != 'agent:implement-local' && secrets.CODEX_AUTH_B64 || '' }}
          ENGINE: ${{ steps.flags.outputs.engine == 'cursor' && 'claude' || steps.flags.outputs.engine }}
          BRANCH: ${{ steps.branch.outputs.name }}
          OUTPUT_DIR: ${{ runner.temp }}
          # Degrade mode: when verify was skipped by design there is no QA
          # Evidence, so write-pr must say so instead of pointing at screenshots.
          VERIFY_MODE: ${{ steps.flags.outputs.verify }}
          VERIFY_REASON: ${{ steps.flags.outputs.verify_reason }}
        run: bun .sandcastle/write-pr/write-pr.ts

      - name: Open draft PR
        if: steps.preflight.outputs.refused != 'true' && success()
        id: open_pr
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          # AGENT_PAT: GITHUB_TOKEN cannot create PRs unless the org-level
          # "Allow GitHub Actions to create and approve pull requests" is on
          # (often off at the org level). A user PAT has no such restriction.
          GH_TOKEN: ${{ secrets.AGENT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR_TITLE=$(cat "${RUNNER_TEMP}/pr_title.txt")
          PR_TITLE="${PR_TITLE:0:256}"
          pr_url=$(gh pr create \
            --draft \
            --base {{BASE_BRANCH}} \
            --head "$BRANCH" \
            --title "$PR_TITLE" \
            --body-file "${RUNNER_TEMP}/pr_description.txt" | tail -n1)
          [ -n "$pr_url" ] || { echo "gh pr create produced no URL" >&2; exit 1; }
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "pr_number=${pr_url##*/}" >> "$GITHUB_OUTPUT"

      - name: Comment recorded verification on the PR
        if: steps.preflight.outputs.refused != 'true' && success() && steps.flags.outputs.recording == 'on'
        env:
          PR_URL: ${{ steps.open_pr.outputs.pr_url }}
          ARTIFACT_URL: ${{ steps.recording_artifact.outputs.artifact-url }}
        run: |
          set -euo pipefail
          [ -n "$PR_URL" ] || { echo "missing PR URL" >&2; exit 1; }
          [ -n "$ARTIFACT_URL" ] || { echo "missing recorded-verification artifact URL" >&2; exit 1; }
          sha=$(git rev-parse HEAD)
          preview_url="${{ github.server_url }}/${{ github.repository }}/blob/${sha}/{{EVIDENCE_DIR}}/issue-${ISSUE_NUMBER}/interaction-preview.gif?raw=1"
          lane="$SANDCASTLE_SANDBOX"
          [ "$lane" = "none" ] && lane="github-cloud"
          body=$(cat <<EOF
          ## Recorded computer-use verification

          ![Recorded interaction preview](${preview_url})

          - **Lane:** \`${lane}\`
          - **Evidence commit:** \`${sha}\`
          - **Full WebM + QA evidence:** [download the 30-day Actions artifact](${ARTIFACT_URL})

          The GIF is an inline preview; the artifact contains the full-resolution recording, report, and screenshots.
          EOF
          )
          gh pr comment "$PR_URL" --body "$body"

      - name: Comment PR link on the issue
        if: steps.preflight.outputs.refused != 'true' && success()
        env:
          PR_URL: ${{ steps.open_pr.outputs.pr_url }}
          VERIFY_MODE: ${{ steps.flags.outputs.verify }}
          VERIFY_REASON: ${{ steps.flags.outputs.verify_reason }}
        run: |
          set -euo pipefail
          [ -n "$PR_URL" ] || { echo "missing PR_URL from open_pr step" >&2; exit 1; }
          if [ "$VERIFY_MODE" = "off" ]; then
            reason="${VERIFY_REASON:-no reason provided}"
            gh issue comment "$ISSUE_NUMBER" --body "AFK Task complete — draft PR: $PR_URL. verify skipped by design: $reason. This run committed no QA Evidence; review the diff in the Files changed tab. {{DEPLOY_NOTE}}"
          else
            gh issue comment "$ISSUE_NUMBER" --body "AFK Task complete — draft PR with committed QA Evidence: $PR_URL. Review the screenshots in the Files changed tab; {{DEPLOY_NOTE_LOWER}}"
          fi

      - name: Salvage push — preserve committed work on failure/cancel
        # A failure after implement (convex gate, verify, write-pr, open-pr)
        # used to lose the ENTIRE run's committed work: the branch only pushed
        # on success. andyChat #283 run 28788950712 (2026-07-06) lost a full
        # implement + codex review + disposition to a gate failure. This step
        # pushes whatever commits exist on the agent branch whenever the run
        # dies after the branch was created — including timeout kills, which
        # GitHub reports as cancelled. Uncommitted debris (e.g. gate-regenerated
        # _generated) is committed as an explicit WIP commit first so the
        # branch carries the exact failing state. It never opens a PR: the
        # branch failed a gate, so a human (or a fresh retry) decides.
        # A retry recreates the branch from base and force-pushes over this on
        # SUCCESS only — so a salvaged branch survives until superseded by a
        # good run. Cannot cover a crash inside the implement phase itself
        # (work not yet committed); that class stays lossy by nature.
        if: steps.preflight.outputs.refused != 'true' && (failure() || cancelled()) && steps.branch.outputs.name != ''
        id: salvage
        continue-on-error: true
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        # Salvage body lives in .sandcastle/salvage.sh (extracted v2.5.0).
        # Host-side on all lanes. Vercel-lane honesty: sandcastle sync-out runs
        # only AFTER a phase succeeds, so this saves commits from COMPLETED
        # phases; the failing phase's in-microVM commits die with it (same
        # lossy class as an implement-crash before commit — upstream
        # sync-on-failure hook is the eventual fix). Docker/cloud lanes keep
        # full coverage via the shared workspace.
        run: bash .sandcastle/salvage.sh

      - name: Mark blocked on failure
        if: steps.preflight.outputs.refused != 'true' && failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER_LABEL: ${{ github.event.label.name }}
          SALVAGED: ${{ steps.salvage.outputs.salvaged }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          reason="(no reason file written — check workflow logs)"
          if [ -f "${RUNNER_TEMP}/failure_reason.txt" ]; then
            reason=$(cat "${RUNNER_TEMP}/failure_reason.txt")
          fi
          salvage_note=""
          if [ "$SALVAGED" = "true" ]; then
            salvage_note="**Committed work preserved** on branch \`$BRANCH\` (unreviewed for merge — it failed this run; inspect/cherry-pick, or just retry: a successful retry force-replaces it)."
          fi
          gh issue edit "$ISSUE_NUMBER" --add-label "agent:blocked" || true
          gh issue comment "$ISSUE_NUMBER" --body "$(cat <<EOF
          \`$TRIGGER_LABEL\` run failed.

          **Reason:** $reason

          $salvage_note

          **Workflow run:** $RUN_URL

          Re-add \`$TRIGGER_LABEL\` to retry.
          EOF
          )"

      - name: Always remove in-progress
        if: always() && steps.preflight.outputs.refused != 'true'
        run: gh issue edit "$ISSUE_NUMBER" --remove-label "agent:in-progress" || true

      - name: Release Codex host lock (local lane)
        # Ownership-guarded: a run that failed BEFORE acquiring must not delete
        # a lock a concurrent run legitimately holds.
        if: always() && steps.preflight.outputs.refused != 'true' && steps.flags.outputs.engine == 'codex' && env.SANDCASTLE_SANDBOX == 'docker'
        run: |
          lock="$HOME/.codex-afk/.lock"
          if [ -f "$lock/owner" ] && grep -q "^run=$GITHUB_RUN_ID$" "$lock/owner"; then
            rm -rf "$lock"
          fi

      - name: Reap sandcastle containers on cancel/failure (docker lane)
        # Neither cancelling a run nor a phase failure stops the phase's docker
        # container — an orphan kept squatting the mini for 11h after a cancel
        # (superaseo #55, 2026-07-04/05) and can keep mutating the shared
        # verify backend with stale branch code; verify's internal timeout
        # (v2.2.2) exits the phase process while its container is still live.
        # Kill every container from this repo's sandcastle image: the
        # one-pipeline-per-repo rule means they can only belong to this run.
        if: (cancelled() || failure()) && env.SANDCASTLE_SANDBOX == 'docker'
        run: docker ps -q --filter "ancestor={{IMAGE_NAME}}" | xargs -r docker rm -f
      # No vercel teardown step needed: sandcastle closes each phase's microVM
      # (stop + delete, persistent:false) when run() ends; the create-time
      # timeout (VERCEL_SANDBOX_TIMEOUT_MINUTES, default 115) is the backstop
      # for a phase process killed mid-run.

  recap:
    # Visual Recap runs as a separate best-effort job on a GitHub-hosted VM
    # regardless of which lane implemented, so a local-lane run frees the Mac
    # mini's runner slot the moment the draft PR + issue comment exist.
    #
    # Best-effort at the JOB level (`continue-on-error: true`): a recap failure
    # never fails the run, blocks the PR, or marks the issue blocked. The PR
    # already carries its QA Evidence; the recap is review sugar.
    needs: implement
    # Gate on the draft PR existing — skipped/refused/failed implement runs
    # leave pr_url empty and this job is skipped. Also gate on the parsed
    # `recap` flag: `recap: off` skips the entire job here, before any checkout
    # or install (composes with the tiny-diff gate inside recap.ts, which handles
    # the recap:on-but-trivial case).
    if: needs.implement.outputs.pr_url != '' && needs.implement.outputs.recap != 'off'
    runs-on: {{CLOUD_RUNS_ON}}
    continue-on-error: true
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      # Always the cloud sandbox mode — this job runs on a cloud-hosted VM.
      SANDCASTLE_SANDBOX: none
      PR_URL: ${{ needs.implement.outputs.pr_url }}
      PR_NUMBER: ${{ needs.implement.outputs.pr_number }}
      BRANCH: ${{ needs.implement.outputs.branch }}

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.implement.outputs.branch }}
          fetch-depth: 0

      - name: Fetch base ref (for the diff range)
        # The recap diff is computed against the base branch; the single-branch
        # checkout above doesn't create that remote-tracking ref, so fetch it.
        run: git fetch --no-tags origin {{BASE_BRANCH}}:refs/remotes/origin/{{BASE_BRANCH}}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "{{BUN_VERSION}}"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Node (recap CLI)
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Claude Code (recap agent run uses noSandbox)
        run: |
          set -euo pipefail
          npm install -g --include=optional @anthropic-ai/claude-code
          node "$(npm root -g)/@anthropic-ai/claude-code/install.cjs"
          claude --version

      - name: Cache Playwright browser (recap screenshots)
        # Keyed on the pinned recap CLI version so a bump re-downloads Chromium;
        # otherwise the cached Chrome-for-Testing is reused (cold download only
        # on a cache miss). `~/.cache/ms-playwright` is the default browsers dir.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ env.RECAP_CLI_VERSION }}
          restore-keys: |
            ms-playwright-

      - name: Visual recap on the draft PR (best-effort)
        # Publishes an interactive Visual Recap of the PR diff to the
        # self-hosted Plan app and upserts a sticky PR comment with the URL +
        # screenshot. The tiny-diff gate inside recap.ts short-circuits before
        # any install, so a skipped recap costs seconds.
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PLAN_RECAP_TOKEN: ${{ secrets.PLAN_RECAP_TOKEN }}
          PLAN_RECAP_APP_URL: ${{ secrets.PLAN_RECAP_APP_URL }}
          OUTPUT_DIR: ${{ runner.temp }}
        run: bun .sandcastle/recap/recap.ts
